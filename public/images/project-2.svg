<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice" role="img">
<defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DED6C6"/><stop offset="1" stop-color="#C9BFAD"/>
    </linearGradient>
    <linearGradient id="p2-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7E1D5"/><stop offset="1" stop-color="#6B6459"/>
    </linearGradient><radialGradient id="p2-g" cx="300" cy="300" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF8F3" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#E7E1D5" stop-opacity="0"/>
    </radialGradient>
    <filter id="p2-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs><rect width="800" height="1000" fill="url(#p2-bg)"/>
  <rect width="800" height="1000" fill="url(#p2-g)"/>
  <rect x="150" y="120" width="500" height="820" fill="url(#p2-face)"/>
  <rect x="150" y="120" width="500" height="820" fill="#1F1C18" opacity="0.06"/>
  <!-- aperture -->
  <rect x="360" y="300" width="200" height="440" fill="#FAF8F3" opacity="0.85"/>
  <rect x="360" y="300" width="200" height="440" fill="url(#p2-g)" opacity="0.6"/>
  <line x1="150" y1="120" x2="150" y2="940" stroke="#FAF8F3" stroke-width="2" opacity="0.4"/>
  <rect x="0" y="0" width="800" height="1000" filter="url(#p2-grain)" opacity="0.08"/>
</svg>
