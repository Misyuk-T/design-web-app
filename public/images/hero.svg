<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" role="img">
<defs>
    <linearGradient id="hero-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F3"/><stop offset="1" stop-color="#DED6C6"/>
    </linearGradient>
    <linearGradient id="hero-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9BFAD"/><stop offset="1" stop-color="#E7E1D5"/>
    </linearGradient>
    <linearGradient id="hero-shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B6459" stop-opacity="0.32"/><stop offset="1" stop-color="#6B6459" stop-opacity="0"/>
    </linearGradient><radialGradient id="hero-glow" cx="1180" cy="300" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF8F3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E7E1D5" stop-opacity="0"/>
    </radialGradient>
    <filter id="hero-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#hero-sky)"/>
  <rect width="1600" height="1000" fill="url(#hero-glow)"/>
  <!-- floor -->
  <rect x="0" y="720" width="1600" height="280" fill="#E7E1D5"/>
  <rect x="0" y="720" width="1600" height="280" fill="url(#hero-shadow)"/>
  <!-- right massing -->
  <rect x="980" y="120" width="620" height="600" fill="url(#hero-wall)"/>
  <rect x="980" y="120" width="18" height="600" fill="#6B6459" opacity="0.18"/>
  <!-- slender pier -->
  <rect x="300" y="300" width="120" height="420" fill="#DED6C6"/>
  <rect x="300" y="300" width="120" height="420" fill="url(#hero-shadow)" opacity="0.5"/>
  <!-- horizon + light shafts -->
  <line x1="0" y1="720" x2="1600" y2="720" stroke="#6B6459" stroke-width="1.5" opacity="0.28"/>
  <line x1="560" y1="0" x2="560" y2="720" stroke="#FAF8F3" stroke-width="2" opacity="0.5"/>
  <line x1="980" y1="0" x2="980" y2="1000" stroke="#6B6459" stroke-width="1" opacity="0.16"/>
  <rect x="0" y="0" width="1600" height="1000" filter="url(#hero-grain)" opacity="0.07"/>
</svg>
