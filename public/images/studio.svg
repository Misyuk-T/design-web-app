<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" preserveAspectRatio="xMidYMid slice" role="img">
<defs>
    <linearGradient id="studio-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F3"/><stop offset="1" stop-color="#DED6C6"/>
    </linearGradient>
    <linearGradient id="studio-wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7E1D5"/><stop offset="1" stop-color="#C9BFAD"/>
    </linearGradient>
    <linearGradient id="studio-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F3" stop-opacity="0.9"/><stop offset="1" stop-color="#FAF8F3" stop-opacity="0"/>
    </linearGradient><radialGradient id="studio-g" cx="640" cy="300" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF8F3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E7E1D5" stop-opacity="0"/>
    </radialGradient>
    <filter id="studio-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs><rect width="900" height="1100" fill="url(#studio-bg)"/>
  <rect width="900" height="1100" fill="url(#studio-g)"/>
  <!-- side wall -->
  <polygon points="0,0 300,120 300,980 0,1100" fill="url(#studio-wall)"/>
  <!-- window light on floor -->
  <polygon points="300,520 720,420 760,760 340,900" fill="url(#studio-light)"/>
  <!-- floor line -->
  <line x1="300" y1="120" x2="300" y2="980" stroke="#6B6459" stroke-width="1.5" opacity="0.22"/>
  <line x1="300" y1="860" x2="900" y2="900" stroke="#6B6459" stroke-width="1" opacity="0.16"/>
  <!-- a quiet upright (furniture/plinth) -->
  <rect x="560" y="640" width="90" height="240" fill="#6B6459" opacity="0.28"/>
  <rect x="0" y="0" width="900" height="1100" filter="url(#studio-grain)" opacity="0.07"/>
</svg>
