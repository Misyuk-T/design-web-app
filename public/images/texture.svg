<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" preserveAspectRatio="xMidYMid slice" role="img">
<defs>
    <linearGradient id="texture-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7E1D5"/><stop offset="1" stop-color="#DED6C6"/>
    </linearGradient><radialGradient id="texture-g" cx="500" cy="460" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF8F3" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E7E1D5" stop-opacity="0"/>
    </radialGradient>
    <filter id="texture-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs><rect width="1000" height="1000" fill="url(#texture-bg)"/>
  <rect width="1000" height="1000" fill="url(#texture-g)"/>
  <rect x="0" y="0" width="1000" height="1000" filter="url(#texture-grain)" opacity="0.12"/>
</svg>
